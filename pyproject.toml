[project]
name = "vaais-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx2>=2.13.1",
    "openai>=3.31.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
vaais-core = "vaais_core:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
